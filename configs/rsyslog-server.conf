# rsyslog-server.conf
#
# Configuración del servidor central de logs (Security Monitor,
# 192.168.10.200) documentada en la Fase 6. Recibe logs por UDP/514
# de los demás hosts del laboratorio (OPNsense, cliente LAN, servidor DMZ).
#
# Colocar en: /etc/rsyslog.d/10-server.conf  (en el Security Monitor)
# Aplicar con: sudo systemctl restart rsyslog

# Habilitar recepción UDP en el puerto 514
module(load="imudp")
input(type="imudp" port="514")

# Guardar los logs recibidos separados por host de origen
$template RemoteHost, "/var/log/remote/%HOSTNAME%/%PROGRAMNAME%.log"
*.* ?RemoteHost
& stop
