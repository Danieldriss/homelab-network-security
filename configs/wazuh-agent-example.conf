<!--
  wazuh-agent-example.conf

  Bloque de configuración del agente Wazuh (ossec.conf) para apuntar
  al manager del laboratorio (Security Monitor, 192.168.10.200),
  documentado en la Fase 8.

  Insertar dentro de <ossec_config> en:
    /var/ossec/etc/ossec.conf   (en el endpoint con el agente instalado)

  Aplicar con: sudo systemctl restart wazuh-agent
-->
<client>
  <server>
    <address>192.168.10.200</address>
    <port>1514</port>
    <protocol>tcp</protocol>
  </server>
</client>
