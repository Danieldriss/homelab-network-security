# rsyslog-client.conf
#
# Configuración de envío de logs desde un cliente (Ubuntu Server DMZ,
# 192.168.20.100) hacia el servidor central de logs (Security Monitor,
# 192.168.10.200:514), documentada en la Fase 6.
#
# Colocar en: /etc/rsyslog.d/60-forward.conf
# Aplicar con: sudo systemctl restart rsyslog
#
# Nota: usar el mismo fichero (con la IP del propio host) en el cliente
# LAN (192.168.10.100) para centralizar también sus logs.

*.* @192.168.10.200:514
