# sshd_hardening.conf
#
# Directivas de endurecimiento de SSH aplicadas en la Fase 5
# (doc/phase-5-system-hardening) sobre el servidor Ubuntu de la DMZ.
#
# NO reemplaza el /etc/ssh/sshd_config completo: añade/ajusta estas
# líneas en él (o colócalas en /etc/ssh/sshd_config.d/hardening.conf
# si tu versión de OpenSSH soporta directorio de includes).
#
# Aplicar con: sudo systemctl restart sshd

# Deshabilitar el login directo como root
PermitRootLogin no

# Limitar los intentos de autenticación por conexión
MaxAuthTries 3

# Desconectar sesiones inactivas
ClientAliveInterval 300
ClientAliveCountMax 2

# Deshabilitar autenticación por contraseña vacía
PermitEmptyPasswords no

# Restringir el acceso SSH a un grupo/usuario concreto (ajustar)
# AllowGroups sshusers

# Deshabilitar reenvío X11 si no es necesario
X11Forwarding no

# Limitar protocolo y algoritmos (OpenSSH moderno ya usa protocolo 2 por defecto)
Protocol 2
